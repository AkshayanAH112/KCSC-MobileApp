# Cloud build of the signed KCSC Admin APK — this project's equivalent of
# EAS Build. EAS only builds Expo/React Native apps; this one is Vite + React
# wrapped with Capacitor, so the APK comes from Gradle here instead.
#
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.6 to also
# publish the APK as a GitHub Release. The signed APK is attached to every run
# as an artifact.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the club's release keystore (kcsc-release.jks),
#                             base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS         kcsc
#   ANDROID_KEY_PASSWORD      same as the keystore password (PKCS12 keystore)
#
# Never swap this keystore: Android only installs an update signed with the
# same key as the installed app. v1.6 is the first release signed with it —
# 1.0–1.5 were signed with an Android Studio debug key, so moving to 1.6
# needs a one-time uninstall of the old app on each phone.
# Optional repository variable:
#   VITE_API_BASE_URL         defaults to the production API below
#
# Before running: bump versionCode/versionName in android/app/build.gradle.

name: Android release build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # only used to create the GitHub Release on a tag

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # .env is gitignored, so the API URL is baked in here instead.
      - name: Build web assets
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://kcsc-web.vercel.app' }}

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — refusing to build an unsigned release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          KCSC_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KCSC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KCSC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KCSC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK after its version
        id: apk
        run: |
          src=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$src" ]; then
            echo "::error::No signed APK produced — check the keystore secrets."
            ls android/app/build/outputs/apk/release || true
            exit 1
          fi
          version=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          out="KCSC-Admin-v${version}.apk"
          mv "$src" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.file }}" --title "KCSC Admin ${GITHUB_REF_NAME}" --generate-notes
